# Sketchbook: white pen on black paper. Hierarchy from brightness, bold,
# italic and underline; red only for errors and unread-mention badges.

[ui.border]
default = "plain"
composer = "plain"
message = "plain"
forum = "plain"

[highlight.Muted]
foreground = "#6b6b6b"
dim = false

[highlight.Border]
foreground = "#262626"

[highlight.FocusBorder]
foreground = "#ffffff"

[highlight.Selection]
foreground = "#ffffff"
bold = true

[highlight.SelectedRow]
background = "#1c1c1c"

[highlight.SelectionBorder]
foreground = "#ffffff"
bold = true

[highlight.ScrollbarThumb]
foreground = "#6b6b6b"

[highlight.LoginTitle]
foreground = "#ffffff"

[highlight.HeaderTitle]
foreground = "#ffffff"

[highlight.MarkdownHeading1]
foreground = "#ffffff"

[highlight.EmbedTitle]
foreground = "#ffffff"

[highlight.ActiveField]
foreground = "#ffffff"
bold = true

[highlight.BotBadge]
foreground = "#e4e4e4"
background = "#3a3a3a"

[highlight.UnreadNotice]
foreground = "#ffffff"
bold = true

[highlight.Editing]
foreground = "#ffffff"

[highlight.Reaction]
foreground = "#a3a3a3"

[highlight.SelfReaction]
foreground = "#ffffff"
bold = true

[highlight.PresenceOnline]
