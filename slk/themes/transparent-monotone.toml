# Transparent Monotone — a grayscale theme that paints almost nothing.
#
# "transparent" is not an ANSI color; it tells slk's renderer to emit the
# terminal-default background (SGR 49) instead of a concrete RGB black, so
# your terminal's own background (and any transparency) shows through.
# Requires a slk build with terminal-default background support.
#
# Palettes are intentionally OPAQUE where a surface must stay legible
# (selection tint, compose-insert tint, the mode badges) — a fully
# transparent selection row would be invisible.

name = "Transparent Monotone"

[colors]
# Grayscale accents. Kept mid-dark so the bold mode badges (white text on
# a Primary/Accent/Error background) stay readable.
primary = "#808080"
accent  = "#6e6e6e"
warning = "#b0b0b0"
error   = "#5a5a5a"

# Fully transparent message pane, surfaces, sidebar and rail.
background   = "transparent"
surface      = "transparent"
surface_dark = "transparent"

text       = "#d6d6d6"
text_muted = "#858585"
border     = "#424242"

sidebar_background = "transparent"
sidebar_text       = "#c8c8c8"
sidebar_text_muted = "#767676"
rail_background    = "transparent"

# Opaque where visibility matters.
selection_background = "#3a3a3a"
selection_foreground = "#e6e6e6"
search_highlight_bg  = "#4a4a4a"
search_highlight_fg  = "#ededed"

# Explicit tints so the derived (mixed) values never fall back to black.
compose_insert_bg      = "#2b2b2b"
selection_bg_focused   = "#333333"
selection_bg_unfocused = "#242424"
