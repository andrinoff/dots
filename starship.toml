# ─────────────────────────────────────────────────────────────────────────────
#  starship.toml · monochrome, two lines, Nerd Font glyphs
#
#  line 1  context on the left ─── last command + machine state on the right
#  line 2  the prompt
#
#  No colours at all: hierarchy comes from bold / normal / italic / dimmed,
#  and "inverted" is reserved for things that need your attention.
#  Follows your terminal's own foreground, so it works on dark and light.
#
#  Needs: a Nerd Font (v3+) and starship >= 1.20    ->  ~/.config/starship.toml
# ─────────────────────────────────────────────────────────────────────────────
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](fg:#3a3a3a)$os$username$hostname$container$directory\
$git_branch${custom.upstream}$git_commit$git_state$git_status$git_metrics\
$package\
$bun$c$cmake$cobol$crystal$dart$deno$dotnet$elixir$elm$erlang$fennel\
$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven\
$nim$nodejs$ocaml$odin$opa$perl$php$purescript$raku$red$rlang$ruby$rust\
$scala$solidity$swift$typst$vlang$xmake$zig\
$python$conda$nix_shell$direnv\
$docker_context$kubernetes$terraform$aws\
$fill\
$status$cmd_duration${custom.mail}$memory_usage$battery$time\
$line_break\
[╰─](fg:#3a3a3a)$jobs$shlvl$sudo$character"""

add_newline = true            # blank line between commands
command_timeout = 1000        # ms; keeps slow toolchains from stalling the prompt
continuation_prompt = '[❯❯](dimmed) '

# ── toolchains ───────────────────────────────────────────────────────────────
# Each appears only inside a project that uses it: icon + version, dimmed.
bun        = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
c          = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
cmake      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
cobol      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
crystal    = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
dart       = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
deno       = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
dotnet     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
elixir     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
elm        = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
erlang     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
fennel     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
fortran    = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
gleam      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
golang     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
gradle     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
haskell    = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
haxe       = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
helm       = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
java       = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
julia      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
kotlin     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
lua        = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
maven      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
nim        = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
nodejs     = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
ocaml      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
odin       = { symbol = "󰟢 ", style = "dimmed", format = '[$symbol($version)]($style) ' }
opa        = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
perl       = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
php        = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
purescript = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
raku       = { symbol = "󱖊 ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
red        = { symbol = "󱍼 ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
rlang      = { symbol = "󰟔 ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
ruby       = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
rust       = { symbol = "󱘗 ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
scala      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
solidity   = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
swift      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
typst      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
vlang      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
xmake      = { symbol = " ", style = "dimmed", version_format = "${raw}", format = '[$symbol($version)]($style) ' }
