# ──────────────────────────────────────────────────────────────────────────────
# TMUX
# ──────────────────────────────────────────────────────────────────────────────

# --- Prefix ───
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix            # Ctrl-a Ctrl-a sends a literal Ctrl-a
bind C-b send-prefix -2

# --- General ───
set -g default-shell /Users/andrinoff/go/bin/ash
set -g default-command /Users/andrinoff/go/bin/ash
set -as terminal-features ",ghostty:extkeys,xterm-ghostty:extkeys,xterm-kitty:extkeys"

# --- Removes the truecolor ---
set -as terminal-overrides ",*:Tc@:RGB@:setrgbf@:setrgbb@"
set -g default-terminal "tmux-256color"

# --- Keys ---
set -s extended-keys always
set -s extended-keys-format csi-u
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0 # no lag after Esc (vim/nvim)
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on # lets apps query the outer terminal (cursor color)
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g display-time 2000
set -g status-interval 5
setw -g aggressive-resize on
setw -g mode-keys vi

# Numbering starts at 1 and stays gap-free
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the running program / folder
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},ash},#{b:pane_current_path},#{pane_current_command}}"

# --- Splits and new windows open in the current directory ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind N new-session
bind Tab last-window

# --- Fuzzy-find a project and jump to its session --- 
bind f display-popup -E -w 70% -h 60% "~/.config/tmux-sessionizer"

# --- Vim-style pane (though I do not use them) movement and resizing ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vi keys). Every copy goes to the macOS clipboard via pbcopy ---
set -s copy-command "pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- Status bar ───────────────────
set -g @bar    "#333333"
set -g @blue   "#5eacd3"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#{@bar},fg=#{@blue}"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#{?client_prefix,#[fg=#{@bar}#,bg=#{@blue}],}[#S]#[default] "
set -g status-right "#(~/.config/tmux-status git '#{pane_current_path}') "

setw -g window-status-separator " "
setw -g window-status-format "#I:#W#{?window_flags,#{window_flags}, }"
setw -g window-status-current-format "#I:#W#{?window_flags,#{window_flags}, }"

# --- Interactive session and windows ---
bind -n MouseDown1StatusLeft choose-tree -Zs
setw -g window-status-activity-style reverse
setw -g window-status-bell-style reverse
setw -g monitor-activity on
set -g visual-activity off

# --- Default colors ---
setw -g pane-border-lines single
setw -g pane-border-style default
setw -g pane-active-border-style "fg=green"
set -g display-panes-active-colour red
set -g display-panes-colour blue
set -g message-style "bg=yellow,fg=black"
set -g message-command-style "bg=black,fg=yellow"
setw -g mode-style "bg=yellow,fg=black"
set -g popup-style default
set -g popup-border-style default
set -g popup-border-lines single
setw -g clock-mode-colour blue
