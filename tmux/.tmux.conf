# ──────────────────────────────────────────────────────────────────────────────
# TMUX
# ──────────────────────────────────────────────────────────────────────────────

# --- Prefix ───
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix            # Ctrl-a Ctrl-a sends a literal Ctrl-a
bind C-b send-prefix -2

# --- General ───
set -g default-shell /home/andrinoff/go/bin/ash
set -g default-command /home/andrinoff/go/bin/ash
# --- Terminal features (truecolor + extended keys) ───
# Reset first so reloading this file doesn't stack duplicate entries
set -su terminal-features
set -su terminal-overrides
set -g default-terminal "tmux-256color"
set -as terminal-features ",ghostty:RGB:extkeys,xterm-ghostty:RGB:extkeys,xterm-kitty:RGB:extkeys,xterm-256color:RGB"

# --- Keys ---
set -s extended-keys always
set -s extended-keys-format csi-u
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0 # no lag after Esc (vim/nvim)
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on # lets apps query the outer terminal (cursor color)
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g display-time 2000
set -g status-interval 5
setw -g aggressive-resize on
setw -g mode-keys vi

# Numbering starts at 1 and stays gap-free
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the running program / folder
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},ash},#{b:pane_current_path},#{pane_current_command}}"

# --- Splits and new windows open in the current directory ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind N new-session
bind Tab last-window

# --- Fuzzy-find a project and jump to its session --- 
bind f display-popup -E -w 70% -h 60% "~/.config/tmux-sessionizer"

# --- Vim-style pane (though I do not use them) movement and resizing ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vi keys). Every copy goes to the macOS clipboard via pbcopy ---
set -s copy-command "pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- Status bar ───────────────────
set -g @fg      "#e8e8e8"
set -g @bright  "#ffffff"
set -g @dim     "#6a6a6a"
set -g @muted   "#8a8a8a"
set -g @surface "#181818"
set -g @border  "#2a2a2a"
set -g @alert   "#d96c6c"

set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#{@muted}"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#{?client_prefix,#[bg=#{@bright}#,fg=#000000#,bold],#[bg=#{@surface}#,fg=#{@fg}]} #S #[default]  "
set -g status-right "#[fg=#{@muted}]#(~/.config/tmux-status git '#{pane_current_path}') "

setw -g window-status-separator "  "
setw -g window-status-style "fg=#{@dim},bg=default"
setw -g window-status-format " #I #W#{?window_zoomed_flag, +,}"
setw -g window-status-current-style "fg=#000000,bg=#{@fg},bold"
setw -g window-status-current-format " #I #W#{?window_zoomed_flag, +,} "

# --- Interactive session and windows ---
bind -n MouseDown1StatusLeft choose-tree -Zs
setw -g window-status-activity-style "fg=#{@fg},bg=default"
setw -g window-status-bell-style "fg=#{@alert},bg=default,bold"
setw -g monitor-activity on
set -g visual-activity off

# --- Colors & borders ---
setw -g pane-border-lines single
setw -g pane-border-style "fg=#{@border}"
setw -g pane-active-border-style "fg=#{@fg}"
set -g display-panes-active-colour "#ffffff"
set -g display-panes-colour "#6a6a6a"
set -g message-style "bg=#{@fg},fg=#000000,bold"
set -g message-command-style "bg=#{@surface},fg=#{@fg}"
setw -g mode-style "bg=#{@fg},fg=#000000"
set -g popup-style "bg=#000000,fg=#{@fg}"
set -g popup-border-style "fg=#{@dim}"
set -g popup-border-lines single
setw -g clock-mode-colour "#e8e8e8"
