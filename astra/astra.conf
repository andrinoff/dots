# ---------------------------------------------------------------------
# Astra —  Hyprland-style tiling window manager for macOS
# ---------------------------------------------------------------------

$mod = alt
$terminal = open -na Ghostty
$browser = open -a Zen
$editor = open -a Zed

# ---------------------------------------------------------------------
# Monitors
# ---------------------------------------------------------------------

monitor = , addreserved, 10, 60, 10, 10
# Do not count OBS display
monitor = OBS Output, disable

#---------------------------------------------------------------------
# Workspaces
# --------------------------------------------------------------------

workspace = 1, monitor:external
workspace = 2, monitor:external
workspace = 3, monitor:external
workspace = 4, monitor:builtin
workspace = 5, monitor:builtin
workspace = 6, monitor:external
workspace = 7, monitor:external
workspace = 8, monitor:external
workspace = 9, monitor:external
workspace = name:A, monitor:external
workspace = name:B, monitor:external
workspace = name:C, monitor:external
workspace = name:D, monitor:external
workspace = name:E, monitor:external

# Dropdowns
workspace = special:btop, gapsout:40, scratchpad:1
workspace = special:matcha, gapsout:40, scratchpad:1
workspace = special:ghdash, gapsout:40, scratchpad:1

# Smart gaps
workspace = w[t1]s[false]f[-1], gapsout:20 10.5% 20 10.5%

# --------------------------------------------------------------------
# Look and feel
# --------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    gaps_workspaces = 20
    border_size = 2
    col.active_border = rgba(ffffffee) rgba(6e6e6eee) 45deg
    col.inactive_border = rgba(59595955)
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 0
    dim_inactive = true
    dim_strength = 0.18
    shadow {
        enabled = false
    }
}


# --------------------------------------------------------------------
# Animations 
# --------------------------------------------------------------------

animations {
    enabled = true
    first_launch_animation = true

    bezier = specialWorkSwitch, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = standard, 0.2, 0, 0, 1

    animation = windowsIn, 1, 3.5, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2.5, emphasizedAccel, popin 80%
    spring = wobble, 0.78, 560, 0.0005
    animation = windowsMove, 1, spring:wobble, wobbly 0.85
    workspace_depth_scale = 0.96
    workspace_depth_dim = 0.25
    workspace_depth_parallax = 1.0
    spring = wsbounce, 0.58, 780, 0.002
    animation = workspaces, 1, spring:wsbounce, slidevert
    animation = specialWorkspace, 1, 3, specialWorkSwitch, slidevert
    animation = border, 1, 4, standard
}

# --------------------------------------------------------------------
# Layouts, input, misc
# --------------------------------------------------------------------

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = slave
    orientation = left
}

input {
    follow_mouse = 1
}

misc {
    focus_on_activate = true
    on_focus_under_fullscreen = 2
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
}

binds {
    workspace_back_and_forth = false
}

# --------------------------------------------------------------------
# Keybinds: bind[flags] = MODS, KEY, DISPATCHER, ARGS
# --------------------------------------------------------------------

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, TAB, overview, toggle
bind = $mod SHIFT, TAB, workspace, previous

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, grave, exec, ~/.config/astra/scratch.sh btop btop
bind = $mod, m, exec, ~/.config/astra/scratch.sh matcha matcha
bind = $mod, g, exec, ~/.config/astra/scratch.sh ghdash gh dash
bind = $mod SHIFT, grave, movetoworkspace, special

bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

bind = $mod, f, fullscreen, 1
bind = $mod SHIFT, f, fullscreen, 0
bind = $mod, b, togglefloating
bind = $mod, p, pseudo
bind = $mod, s, togglesplit

binde = $mod, minus, resizeactive, -50 0
binde = $mod, equal, resizeactive, 50 0

bind = $mod, mouse:273, resizewindow
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bind = $mod, RETURN, exec, $terminal
bind = $mod SHIFT, RETURN, exec, $browser

bind = ALT, SPACE, exec, notifyutil -p local.caelestia.launcher
bind = $mod, i, exec, notifyutil -p local.caelestia.dashboard
bind = $mod, x, exec, notifyutil -p local.caelestia.session
bind = ALT, w, exec, notifyutil -p local.caelestia.wallpaper

# --------------------------------------------------------------------
# Window rules: windowrulev2 = EFFECT, field:REGEX[, field:REGEX]
# --------------------------------------------------------------------

windowrulev2 = float, class:^(Passwords)$
windowrulev2 = float, class:^(OpenVPN)$
windowrulev2 = float, class:^(Reminders)$
windowrulev2 = float, class:^(Steam)$
windowrulev2 = float, class:^(Notes)$
windowrulev2 = float, class:^(QuickTime Player)$
windowrulev2 = float, class:^(Mail)$
windowrulev2 = float, class:^(Photos)$
windowrulev2 = float, class:^(Messages)$
windowrulev2 = float, class:^(Calculator)$
windowrulev2 = float, class:^(Software Update)$
windowrulev2 = float, class:^(Dictionary)$
windowrulev2 = float, class:^(VLC)$
windowrulev2 = float, class:^(System Settings)$
windowrulev2 = float, class:^(zoom\.us)$
windowrulev2 = float, class:^(Photo Booth)$
windowrulev2 = float, class:^(Archive Utility)$
windowrulev2 = float, class:^(App Store)$
windowrulev2 = float, class:^(Activity Monitor)$
windowrulev2 = float, class:^(Finder)$
windowrulev2 = float, class:^(universalAccessAuthWarn)$
windowrulev2 = float, title:^(About This Mac)$

windowrulev2 = float, class:^(Vicinae)$
windowrulev2 = noborder, class:^(Vicinae)$

windowrulev2 = workspace special:dropdown, class:^(Ghostty)$, title:^(astra-scratchpad:dropdown)$
windowrulev2 = workspace special:matcha, class:^(Ghostty)$, title:^(astra-scratchpad:matcha)$
windowrulev2 = workspace special:ghdash, class:^(Ghostty)$, title:^(astra-scratchpad:ghdash)$
