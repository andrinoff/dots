[menu]
# An opaque card on a heavy scrim: the page goes dark, the card stays crisp.
background                = "#000000"
background-alpha          = 1.0
text                      = "#e4e4e4"
border                    = "hyprland.active-border"
border-alpha              = 1.0
border-width              = 1
scrim                     = "#000000"
scrim-alpha               = 0.72
# Inverse selection, like a highlighter dragged across the page.
selected-background       = "#ffffff"
selected-background-alpha = 1.0
selected-text             = "#000000"
selected-border           = "#ffffff"
selected-border-alpha     = 1.0
